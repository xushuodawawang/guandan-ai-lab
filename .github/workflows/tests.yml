name: tests
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e ".[dev]"
      - run: python -m guandan_ai fetch-platform
      - run: python -m guandan_ai fetch-baseline
      - run: python -m pytest -q

